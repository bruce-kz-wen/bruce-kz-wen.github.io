<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce Wen - Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="header-placeholder"></div>
        <main>
            <section>
                <h2>Garden</h2>
                <hr>
                <p class="garden-intro">Notes, drafts, and other things in progress.</p>
                <ul class="garden-list">
                    <!--
                        To add an entry, copy the <li> block below, put the file in files/garden/,
                        and keep the list ordered newest first.
                    -->
                    <li>
                        <div class="garden-item-header">
                            <a href="files/garden/example-note.pdf">Example note</a>
                            <time datetime="2026-08-05">August 2026</time>
                        </div>
                        <p class="garden-description">A one-sentence description of what this file is about.</p>
                    </li>
                </ul>
            </section>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
